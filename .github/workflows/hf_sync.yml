name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Make sure to change 'Joeyrazor/indmoney-pulse-ui' to your actual HF username and space name if different!
          git push --force https://Joeyrazor:$HF_TOKEN@huggingface.co/spaces/Joeyrazor/indmoney-pulse-ui main
